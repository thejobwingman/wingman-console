name: Deploy Intake Dev

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # ✅ Make sure Vite has the Cognito values at build time
      # (Vite only injects env vars that start with VITE_)
      - name: Create .env for build (dev)
        run: |
          cat > .env << 'EOF'
          VITE_COGNITO_DOMAIN=${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_USER_POOL_ID=${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID=${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION=${{ vars.VITE_COGNITO_REGION }}
          VITE_APP_ENV=dev
          EOF

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3 (dev)
        run: aws s3 sync dist "s3://${{ vars.S3_BUCKET_DEV }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
